apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: menu-api
  template:
    metadata:
      labels:
        app: menu-api
    spec:
      containers:
        - name: menu-api
          image: menu-api
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dhaba-config
            - secretRef:
                name: dhaba-secrets
          readinessProbe:
            httpGet:
              path: /livez
              port: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: menu-api
spec:
  selector:
    app: menu-api
  ports:
    - port: 8000
      targetPort: 8000
