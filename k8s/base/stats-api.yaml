apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stats-api
  template:
    metadata:
      labels:
        app: stats-api
    spec:
      containers:
        - name: stats-api
          image: stats-api
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: dhaba-config
            - secretRef:
                name: dhaba-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stats-api
spec:
  selector:
    app: stats-api
  ports:
    - port: 8001
      targetPort: 8001
