name: Deploy to EKS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      cluster:
        required: true
        type: string
      namespace:
        required: true
        type: string
      image-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      ENVIRONMENT: ${{ inputs.environment }}
      NAMESPACE: ${{ inputs.namespace }}
      IMAGE_TAG: ${{ inputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          for key in POSTGRES_PASSWORD DB_PASSWORD APP_KEY; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key" >&2
              exit 1
            fi
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure kubectl
        env:
          CLUSTER: ${{ inputs.cluster }}
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
      - name: Create namespace and application config
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create configmap init-sql \
            --from-file=init.sql=db/init.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic dhaba-secrets \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=APP_KEY="$APP_KEY" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply manifests
        run: |
          cd "k8s/overlays/$ENVIRONMENT"
          sed -i "s|__ECR_REGISTRY__|$ECR_REGISTRY|g" kustomization.yaml
          sed -i "s|__IMAGE_TAG__|$IMAGE_TAG|g" kustomization.yaml
          kubectl apply -k .
      - name: Wait for rollout
        run: |
          for deployment in menu-api orders-api kitchen-worker stats-api web; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$deployment" --timeout=5m
          done
