name: Deploy to EC2 kind cluster

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      namespace:
        required: true
        type: string
      image-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, kind]
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      ENVIRONMENT: ${{ inputs.environment }}
      NAMESPACE: ${{ inputs.namespace }}
      IMAGE_TAG: ${{ inputs.image-tag }}
      KIND_CLUSTER_NAME: ${{ vars.KIND_CLUSTER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          for key in POSTGRES_PASSWORD DB_PASSWORD APP_KEY; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key" >&2
              exit 1
            fi
          done
          for key in AWS_REGION AWS_ACCOUNT_ID IMAGE_TAG KIND_CLUSTER_NAME; do
            if [ -z "${!key}" ]; then
              echo "Missing variable: $key" >&2
              exit 1
            fi
          done
          for tool in docker kind kubectl; do
            command -v "$tool" >/dev/null || { echo "$tool is required on the runner" >&2; exit 1; }
          done
      - name: Ensure kind cluster is running
        run: |
          if ! kubectl cluster-info --context "kind-$KIND_CLUSTER_NAME" >/dev/null 2>&1; then
            echo "kind cluster '$KIND_CLUSTER_NAME' is not reachable; recreating it"
            kind delete cluster --name "$KIND_CLUSTER_NAME" || true
            kind create cluster --name "$KIND_CLUSTER_NAME" --config kind-config.yaml
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Reclaim disk space
        run: |
          df -h /
          docker image prune -af
          docker exec "$KIND_CLUSTER_NAME-control-plane" ctr -n k8s.io images prune || true
          df -h /
      - name: Load images into kind
        run: |
          for svc in web menu-api orders-api kitchen-worker stats-api; do
            image="$ECR_REGISTRY/dhaba-tactech/$svc:$IMAGE_TAG"
            docker pull "$image"
            kind load docker-image "$image" --name "$KIND_CLUSTER_NAME"
          done
      - name: Create namespace and application config
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create configmap init-sql \
            --from-file=init.sql=db/init.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic dhaba-secrets \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=APP_KEY="$APP_KEY" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Clear stuck terminating pods
        run: |
          kubectl -n "$NAMESPACE" get pods \
            -l 'app in (menu-api,orders-api,kitchen-worker,stats-api,web)' \
            -o custom-columns=NAME:.metadata.name,DEL:.metadata.deletionTimestamp --no-headers |
            while read -r name deleted; do
              if [ "$deleted" != "<none>" ] && [ -n "$deleted" ]; then
                echo "Force deleting stuck pod $name"
                kubectl -n "$NAMESPACE" delete pod "$name" --grace-period=0 --force || true
              fi
            done
      - name: Apply manifests
        run: |
          cd "k8s/overlays/$ENVIRONMENT"
          sed -i "s|__ECR_REGISTRY__|$ECR_REGISTRY|g" kustomization.yaml
          sed -i "s|__IMAGE_TAG__|$IMAGE_TAG|g" kustomization.yaml
          kubectl apply -k .
      - name: Wait for infrastructure
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/postgres --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deployment/redis --timeout=5m
      - name: Wait for rollout
        run: |
          diagnose() {
            kubectl -n "$NAMESPACE" get pods -o wide
            kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp
            for app in "$@" postgres redis; do
              kubectl -n "$NAMESPACE" get deployment "$app" -o yaml || true
              kubectl -n "$NAMESPACE" describe pod -l "app=$app" || true
              kubectl -n "$NAMESPACE" logs -l "app=$app" --all-containers --tail=100 || true
            done
          }
          for deployment in menu-api orders-api kitchen-worker stats-api web; do
            if ! kubectl -n "$NAMESPACE" rollout status "deployment/$deployment" --timeout=5m; then
              diagnose "$deployment"
              exit 1
            fi
          done
